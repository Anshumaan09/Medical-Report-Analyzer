[project]
name = "medical-report-analyzer"
version = "0.1.0"
description = "AI-powered medical report analyzer using OCR, RAG, and structured extraction"
readme = "README.md"
authors = [
    { name = "Anshumaan09", email = "anshumaan342@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "groq>=1.6.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "loguru>=0.7.3",
    "opencv-python>=5.0.0.93",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.60.0",
    "torchvision>=0.28.0",
    "uvicorn>=0.52.0",
]

[tool.uv]
package = true
